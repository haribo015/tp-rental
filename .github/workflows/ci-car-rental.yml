name: CI - car-rental-service

on:
  # No `paths` filter on pull requests: the checks below are *required* on
  # `main`. A filtered workflow never reports a status, so a PR that does not
  # touch this service would stay blocked on "Expected - waiting for status".
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/car-rental-service/**'
      - '.github/workflows/ci-car-rental.yml'
  workflow_dispatch:

# Least privilege by default; the image job elevates only what it needs.
permissions:
  contents: read

# A new push on the same PR makes the previous run obsolete. Runs on `main`
# are never cancelled so that an image publication is not interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_DIR: apps/car-rental-service
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/car-rental-service

jobs:
  tests:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run unit and integration tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/build/test-results/test/
            ${{ env.SERVICE_DIR }}/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Java quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --continue --no-daemon

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-checkstyle-reports
          path: ${{ env.SERVICE_DIR }}/build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Java Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, quality]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # On pull requests the image is built (the Dockerfile is validated) but
      # never pushed: untrusted code must not reach the registry.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=car-rental-service
          cache-to: type=gha,scope=car-rental-service,mode=max
