name: CI - pricing-service

on:
  # No `paths` filter on pull requests: the checks below are *required* on
  # `main`. A filtered workflow never reports a status, so a PR that does not
  # touch this service would stay blocked on "Expected - waiting for status".
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/pricing-service/**'
      - '.github/workflows/ci-pricing.yml'
  workflow_dispatch:

# Least privilege by default; the image job elevates only what it needs.
permissions:
  contents: read

# A new push on the same PR makes the previous run obsolete. Runs on `main`
# are never cancelled so that an image publication is not interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_DIR: apps/pricing-service
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pricing-service

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --junitxml=build/test-results/pytest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: ${{ env.SERVICE_DIR }}/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # The JUnit report is kept as an artifact; on failure the same findings
      # are printed as GitHub annotations, visible directly on the PR diff.
      - name: Ruff lint
        run: |
          mkdir -p build/reports/ruff
          python -m ruff check app tests \
            --output-format=junit --output-file=build/reports/ruff/ruff-junit.xml \
          || { python -m ruff check app tests --output-format=github; exit 1; }

      - name: Ruff format
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail  # keep ruff's exit code through `tee`
          mkdir -p build/reports/ruff
          python -m ruff format --check --diff app tests | tee build/reports/ruff/format.diff

      - name: Upload Ruff reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ruff-reports
          path: ${{ env.SERVICE_DIR }}/build/reports/ruff/
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Python Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests, quality]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # On pull requests the image is built (the Dockerfile is validated) but
      # never pushed: untrusted code must not reach the registry.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pricing-service
          cache-to: type=gha,scope=pricing-service,mode=max
