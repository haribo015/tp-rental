name: Secret detection

on:
  # Required check on `main`: no `paths` filter, it must report on every PR.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a secret removed in a later commit is still exposed in
      # an earlier one, so scanning only the last diff is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The CLI is used instead of gitleaks-action: on pull requests the action
      # only scans the PR commits, and it needs a license for organisations.
      - name: Install Gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      # --redact: findings never print the secret value in logs or reports.
      - name: Scan the whole Git history
        run: |
          ./gitleaks git . \
            --redact \
            --no-banner \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 7
          if-no-files-found: warn
