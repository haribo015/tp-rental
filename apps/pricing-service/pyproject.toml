[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes (unused imports, undefined names...),
# I: import sorting (isort). Any violation makes `ruff check` exit non-zero.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
